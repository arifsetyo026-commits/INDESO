<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#004a27">
<title>{{USAHA}} · Keluar</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef4ef;color:#163528;min-height:100vh;display:grid;place-items:center;padding:16px}
.kartu{max-width:400px;width:100%;background:#fff;border:1px solid #dce8df;border-radius:16px;box-shadow:0 6px 20px rgba(0,55,28,.10);padding:24px 20px;text-align:center}
h1{margin:0 0 6px;font-size:20px}p{margin:0 0 14px;color:#6e8177;font-size:14px}
.baris{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #eef3ef;font-size:14px;text-align:left}
.baris span{color:#6e8177}
a.tombol{display:block;margin-top:16px;border-radius:12px;padding:13px;background:#067d40;color:#fff;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="kartu">
  <h1>Anda sudah keluar</h1>
  <p>Terima kasih telah memakai WiFi {{USAHA}}. Sisa waktu voucher masih bisa dipakai lagi.</p>
  <div class="baris"><span>Voucher</span><b>$(username)</b></div>
  <div class="baris"><span>Lama terhubung</span><b>$(uptime)</b></div>
  <div class="baris"><span>Unduh / unggah</span><b>$(bytes-out-nice) / $(bytes-in-nice)</b></div>
  <a class="tombol" href="$(link-login)">Masuk lagi</a>
</div>
</body>
</html>
