<!doctype html>
<!--
  LOGOUT.HTML : tampil setelah menekan Keluar.
  Masa pakai voucher tetap berjalan; HP yang sama tersambung lagi otomatis (mac-cookie).
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#004f29">
<title>Sudah keluar — {{USAHA}}</title>
<style>{{CSS}}</style>
</head>
<body>
<div class="kartu tengah">
  <div class="ikon abu">⏻</div>
  <h1>Anda sudah keluar</h1>
  <p class="lead">Terima kasih. Masa pakai voucher <b>$(username)</b> tetap berjalan; sambungkan lagi dari HP ini kapan saja, tanpa memasukkan kode. Sesi tadi: <b>$(uptime)</b>.</p>
  <div class="data" style="text-align:left">
    <div><small>Unduh</small><b>$(bytes-out-nice)</b></div>
    <div><small>Unggah</small><b>$(bytes-in-nice)</b></div>
  </div>
  <a class="tombol" href="$(link-login)">Masuk lagi</a>
</div>
<div class="bawah"><span class="slogan">{{USAHA}} · cepat · stabil · terjangkau</span></div>
</body>
</html>
