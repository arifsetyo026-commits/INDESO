<!doctype html>
<!--
  ALOGIN.HTML : tampil sesaat setelah BERHASIL masuk, lalu pindah otomatis.
    $(link-redirect)  situs tujuan (yang tadi ingin dibuka pengguna)
    $(link-status)    halaman status koneksi
  Angka "3" di meta refresh = jeda detik (samakan dengan "3s" di css .jalan i).
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta http-equiv="refresh" content="3; url=$(link-redirect)">
<meta name="theme-color" content="#004f29">
<title>Berhasil terhubung — {{USAHA}}</title>
<style>{{CSS}}</style>
</head>
<body>
<div class="kartu tengah">
  <div class="ikon">✓</div>
  <h1>Berhasil terhubung</h1>
  <p class="lead">Selamat berinternet, <b>$(username)</b>. Halaman tujuan terbuka sebentar lagi.</p>
  <div class="jalan"><i></i></div>
  <p class="catatan" style="margin:0 0 14px">Mengalihkan…</p>
  <a class="tombol" href="$(link-redirect)">Lanjutkan sekarang</a>
  <a class="tautan" href="$(link-status)">Lihat status koneksi</a>
</div>
<div class="bawah"><span class="slogan">{{USAHA}} · cepat · stabil · terjangkau</span></div>
</body>
</html>
