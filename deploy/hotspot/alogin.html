<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta http-equiv="refresh" content="3; url=$(link-redirect)">
<meta name="theme-color" content="#004a27">
<title>{{USAHA}} · Berhasil masuk</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef4ef;color:#163528;min-height:100vh;display:grid;place-items:center;padding:16px}
.kartu{max-width:400px;width:100%;background:#fff;border:1px solid #dce8df;border-radius:16px;box-shadow:0 6px 20px rgba(0,55,28,.10);padding:26px 20px;text-align:center}
.cek{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(145deg,#85e936,#1a9e4d);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900}
h1{margin:0 0 6px;font-size:20px}p{margin:0;color:#6e8177;font-size:14px}
a.tombol{display:block;margin-top:16px;border-radius:12px;padding:13px;background:#067d40;color:#fff;font-weight:800;text-decoration:none}
a.kecil{display:inline-block;margin-top:12px;color:#067d40;font-size:13px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="kartu">
  <div class="cek">✓</div>
  <h1>Berhasil terhubung</h1>
  <p>Selamat berinternet di {{USAHA}}. Halaman tujuan akan terbuka sebentar lagi.</p>
  <a class="tombol" href="$(link-redirect)">Lanjutkan</a>
  <a class="kecil" href="$(link-status)">Lihat sisa waktu voucher</a>
</div>
</body>
</html>
